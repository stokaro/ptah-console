# The image the console runs. The tag defaults to the chart's appVersion; a
# digest, when given, pins it.
image:
  repository: ghcr.io/stokaro/ptah-console
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
# Secrets the kubelet pulls the image with, by name, when the registry asks
# for credentials: [{name: ghcr-pull}].
imagePullSecrets: []

# One replica, or none: sessions live in the replica's memory, so more than
# one would sign people out at random. More are refused.
replicaCount: 1

# Required. A DNS label that tells this installation's Kubernetes usernames,
# ptah-console:<installationID>:<account id>, apart from another's.
installationID: ""

# Required. The https address people open the console at, with no path.
publicURL: ""

# Required. The namespaces the console shows, and the ones accounts get their
# roles in. The console reads nothing outside them.
namespaces: []

# Required, unless oidc is enabled. Who may sign in, and what each account
# may do in every namespace above. An id never changes: RBAC names it. roles are any of:
#   viewer                reads every Ptah kind except the chunks a plan's SQL is in
#   plan-reader           reads schemas, plans and their SQL (operator example)
#   desired-state-author  edits schemas and migrations (operator example)
#   diagnostic-reader     reads Ptah kinds, Jobs, Pods, logs, Events (operator example)
#   approver              the operator chart's approver ClusterRole, bound per namespace
accounts: []
#  - id: alex
#    login: alex@example.com
#    displayName: Alex Morgan
#    roles: [viewer, approver]

# Accounts may also have connection-admin, which creates, replaces and
# removes entries of the registry below; it grants nothing in any namespace of
# the ceiling.

# The operator chart's approver ClusterRole, which the approver role binds.
# The operator chart names it <its fullname>-approver; for the release name its
# documentation uses, ptah-operator, that is ptah-operator-ptah-operator-approver.
approverClusterRole: ptah-operator-ptah-operator-approver

# The registry of the clusters the console reaches, console.ptah.run. Off, the
# console reaches only the cluster it runs in, as it always has. On, the chart
# records this cluster as a co-located entry the console checks itself against
# when it starts. Its connection UID follows from installationID and
# namespaces, so a changed ceiling is a new connection rather than an edited
# one. The registry's CRDs are in the chart's crds directory, which Helm
# installs once and never upgrades or removes.
registry:
  enabled: false

# The listener the agents of external clusters dial: a port, a Service and a
# certificate of its own, apart from the browser's, so a browser session never
# reaches an agent endpoint and an agent credential never reaches a browser
# one. It needs the registry. How the Service is exposed to the other clusters,
# a LoadBalancer or an Ingress that passes TLS through, is yours to choose.
agents:
  enabled: false
  # Required when enabled: what an enrollment file tells agents. The https
  # root they dial, as the Service is exposed to them; the name the
  # listener's certificate carries; and the console's own CA that issued it,
  # in PEM.
  address: ""
  serverName: ""
  caBundle: ""
  # Required when enabled. A kubernetes.io/tls Secret with the listener's
  # certificate from the console's own CA, for the name agents are enrolled
  # with. Agents trust that CA and that name and nothing else.
  tls:
    secretName: ""
  service:
    type: ClusterIP
    port: 443
    # With type NodePort or LoadBalancer, the node port to use instead of
    # one the cluster picks.
    nodePort: null
    annotations: {}
  # With networkPolicy.enabled, the peers that may reach the agent port.
  # Empty admits any source: agents come from other clusters.
  ingressFrom: []

# Required with accounts. An existing Secret with the passwords file under
# key: one line of <account id>:<bcrypt hash> per account. ptah-console
# accounts hash makes a hash. A changed password takes effect when the Pod
# restarts.
passwords:
  secretName: ""
  key: passwords

# Sign people in with an OpenID Connect provider instead of Console accounts.
# On, accounts and passwords stay empty, and the console's ServiceAccount gets
# no impersonation rule: each person acts with their own ID token. The API
# server has to trust issuerURL with clientID as an audience, through its OIDC
# flags or its AuthenticationConfiguration; it maps each token to a username
# and groups, and RBAC decides. The registry and agents act as accounts, so
# they stay off.
oidc:
  enabled: false
  # Required when enabled: the issuer, exactly as its ID tokens name it, and
  # the console's client there.
  issuerURL: ""
  clientID: ""
  # How the sign-in page names the provider; empty uses issuerURL.
  displayName: ""
  # The CA, in PEM, the console trusts for the issuer; empty trusts the
  # image's roots.
  issuerCA: ""
  # Scopes asked for beside openid, such as the one a provider puts groups
  # under, or offline_access for a refresh token.
  extraScopes: []
  # An existing Secret with the console's client secret under key. Empty, the
  # console is a public client, which PKCE protects.
  clientSecret:
    secretName: ""
    key: client-secret
  # The users and groups, as the API server names them after its own mapping
  # and prefix, and the roles each gets in every namespace above, from the
  # list under accounts except connection-admin. A name starting with system:
  # is refused: system:authenticated would give the roles to everyone.
  subjects: []
  #  - kind: Group
  #    name: "oidc:ptah-approvers"
  #    roles: [viewer, approver]

# Exactly one of the two. secretName names an existing kubernetes.io/tls
# Secret the console serves HTTPS with, read again when it is renewed.
# terminatedUpstream declares that an Ingress or a Gateway in front of the
# console terminates TLS, and the console serves plain HTTP to it.
tls:
  secretName: ""
  terminatedUpstream: false

# The networks of the proxies in front of the console, such as the ingress
# controller's Pod network. Only a request whose connection comes from one of
# them has its X-Forwarded-For read, from the right, to count sign-in attempts
# per client rather than per proxy. Empty, the header is never read. Every
# address (/0) is refused. Setting it requires networkPolicy.enabled with
# ingressFrom naming the proxies, so nothing else can reach the console.
trustedProxies: []

# Refuse every change the console could send, whatever an account may do.
readOnly: false

service:
  type: ClusterIP
  # Defaults to 443 when the console serves TLS, 80 when a proxy does.
  port: null

ingress:
  enabled: false
  className: ""
  annotations: {}
  # The Ingress's own TLS, for terminatedUpstream: [{secretName: ...}]. The
  # host is publicURL's.
  tls: []

httpRoute:
  enabled: false
  annotations: {}
  # The Gateway listeners to attach to, such as [{name: public, namespace: gateway}].
  parentRefs: []

# A policy that admits the given peers to the console and lets the console
# reach only the API server. Off by default, and required with trustedProxies.
networkPolicy:
  enabled: false
  # NetworkPolicy peers that may reach the console, such as the ingress
  # controller's namespace.
  ingressFrom: []
  apiServer:
    # The API server's addresses as CIDRs. Required when enabled.
    cidrs: []
    ports: [443, 6443]

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
