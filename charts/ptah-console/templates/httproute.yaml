{{- if .Values.httpRoute.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "ptah-console.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ptah-console.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames: [{{ include "ptah-console.host" . | quote }}]
  rules:
    - backendRefs:
        - name: {{ include "ptah-console.fullname" . }}
          port: {{ include "ptah-console.port" . }}
{{- end }}
