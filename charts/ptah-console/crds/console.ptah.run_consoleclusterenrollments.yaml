---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: consoleclusterenrollments.console.ptah.run
spec:
  group: console.ptah.run
  names:
    kind: ConsoleClusterEnrollment
    listKind: ConsoleClusterEnrollmentList
    plural: consoleclusterenrollments
    shortNames:
    - cce
    singular: consoleclusterenrollment
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.clusterName
      name: Cluster
      type: string
    - jsonPath: .status.expiresAt
      name: Expires
      type: date
    - jsonPath: .status.completion.completedAt
      name: Completed
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ConsoleClusterEnrollment is a connection being enrolled: what an
          installation administrator asked for, held until the target administrator's
          helper completes it and an administrator activates it, or until it expires.
          It is not a connection: nothing is dispatched through it.

          An administrator creates it through the console, as themselves. The console
          alone writes its status: the verifier of the single-use bootstrap secret,
          when the secret expires, the enrollment's fingerprint, and what the helper
          reported when it completed.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec is what the administrator asked for. It is immutable.
            properties:
              accounts:
                description: |-
                  Accounts are the Console accounts the agent will act for, with the
                  roles each gets in every namespace of the ceiling.
                items:
                  description: EnrollmentAccount is one account the agent will act
                    for.
                  properties:
                    id:
                      description: ID is the Console account.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    roles:
                      description: Roles are what the account gets in every namespace
                        of the ceiling.
                      items:
                        description: |-
                          EnrollmentRole is a role an account gets in every namespace of the ceiling
                          on the enrolled cluster.
                        enum:
                        - viewer
                        - plan-reader
                        - desired-state-author
                        - diagnostic-reader
                        - approver
                        type: string
                      maxItems: 5
                      minItems: 1
                      type: array
                      x-kubernetes-list-type: set
                  required:
                  - id
                  - roles
                  type: object
                maxItems: 256
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - id
                x-kubernetes-list-type: map
              approverClusterRole:
                description: |-
                  ApproverClusterRole is the operator chart's approver ClusterRole on the
                  target, which the approver role binds.
                maxLength: 253
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: the approver role is the operator's approver ClusterRole,
                    never an administrator role
                  rule: '!(self in [''cluster-admin'', ''admin'', ''edit'']) && !self.startsWith(''system:'')'
              clusterName:
                description: ClusterName is the name the connection's ConsoleCluster
                  will have.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              connectionUID:
                description: ConnectionUID is the new connection's identity.
                pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                type: string
              consoleCASHA256:
                description: |-
                  ConsoleCASHA256 is the SHA-256 of the console's own CA, the only one the
                  agent will accept the console under.
                pattern: ^sha256:[0-9a-f]{64}$
                type: string
              consoleServerName:
                description: |-
                  ConsoleServerName is the TLS name the agent will require of the
                  console.
                maxLength: 253
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
              installationID:
                description: InstallationID is the console's.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              namespaces:
                description: Namespaces is the ceiling on the target.
                items:
                  maxLength: 63
                  minLength: 1
                  pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                  type: string
                maxItems: 64
                minItems: 1
                type: array
                x-kubernetes-list-type: set
            required:
            - accounts
            - approverClusterRole
            - clusterName
            - connectionUID
            - consoleCASHA256
            - consoleServerName
            - installationID
            - namespaces
            type: object
            x-kubernetes-validations:
            - message: an enrollment cannot be edited; start a new one
              rule: self == oldSelf
          status:
            description: |-
              Status is the console's record of the enrollment. Nothing else writes
              it.
            properties:
              bootstrapVerifier:
                description: |-
                  BootstrapVerifier is the lowercase hex SHA-256 of the single-use
                  bootstrap secret. The console never keeps the secret.
                pattern: ^[0-9a-f]{64}$
                type: string
              completion:
                description: Completion is what the helper reported, once.
                properties:
                  completedAt:
                    description: CompletedAt is when the helper completed the enrollment.
                    format: date-time
                    type: string
                  credentialVerifier:
                    description: |-
                      CredentialVerifier is the lowercase hex SHA-256 of the channel
                      credential.
                    pattern: ^[0-9a-f]{64}$
                    type: string
                  targetCASHA256:
                    description: |-
                      TargetCASHA256 is the SHA-256 of the CA bundle the helper's context
                      trusts for it.
                    pattern: ^sha256:[0-9a-f]{64}$
                    type: string
                  targetServer:
                    description: |-
                      TargetServer is the target API server, as the helper's context names
                      it.
                    maxLength: 512
                    minLength: 9
                    pattern: ^https://[^[:space:]/?#@]+(/[^[:space:]?#]*)?$
                    type: string
                required:
                - completedAt
                - credentialVerifier
                - targetCASHA256
                - targetServer
                type: object
              conditions:
                description: Conditions are the enrollment's verdicts.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              expiresAt:
                description: ExpiresAt is when the bootstrap secret stops being accepted.
                format: date-time
                type: string
              fingerprint:
                description: |-
                  Fingerprint is the SHA-256 of the enrollment's identity, which the
                  console and the target administrator's helper both show.
                pattern: ^sha256:[0-9a-f]{64}$
                type: string
            type: object
            x-kubernetes-validations:
            - message: a completed enrollment stays completed as it was
              rule: '!has(oldSelf.completion) || (has(self.completion) && self.completion
                == oldSelf.completion)'
            - message: an enrollment's bootstrap secret is issued once
              rule: '!has(oldSelf.bootstrapVerifier) || (has(self.bootstrapVerifier)
                && self.bootstrapVerifier == oldSelf.bootstrapVerifier)'
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
