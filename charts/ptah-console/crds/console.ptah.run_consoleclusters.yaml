---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: consoleclusters.console.ptah.run
spec:
  group: console.ptah.run
  names:
    kind: ConsoleCluster
    listKind: ConsoleClusterList
    plural: consoleclusters
    shortNames:
    - ccl
    singular: consolecluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.profile
      name: Profile
      type: string
    - jsonPath: .spec.configurationOwner
      name: Owner
      type: string
    - jsonPath: .status.conditions[?(@.type=="Connected")].status
      name: Connected
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ConsoleCluster is one connection of a hosted console to a cluster: what the
          console trusts about it and what it may reach there. Its spec cannot be
          edited. A change of trust, profile or scope is a new connection with a new
          connection UID, enrolled again, and the old one is revoked; nothing is
          retargeted in place.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec is the connection's trust and reach. It is immutable.
            properties:
              agent:
                description: |-
                  Agent is the trust of an Agent connection, as the target administrator
                  approved it at enrollment. A CoLocated connection has none.
                properties:
                  consoleCASHA256:
                    description: |-
                      ConsoleCASHA256 is the SHA-256 of the console's own CA, the only one
                      the agent accepts the console under.
                    pattern: ^sha256:[0-9a-f]{64}$
                    type: string
                  consoleServerName:
                    description: ConsoleServerName is the TLS name the agent requires
                      of the console.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  targetCASHA256:
                    description: |-
                      TargetCASHA256 is the SHA-256 of the CA bundle the target's API server
                      presented at enrollment.
                    pattern: ^sha256:[0-9a-f]{64}$
                    type: string
                  targetServer:
                    description: |-
                      TargetServer is the target cluster's API server address as enrolled. The
                      console never dials it; it identifies the cluster to a person.
                    maxLength: 512
                    minLength: 9
                    pattern: ^https://[^[:space:]/?#@]+(/[^[:space:]?#]*)?$
                    type: string
                required:
                - consoleCASHA256
                - consoleServerName
                - targetCASHA256
                - targetServer
                type: object
              configurationOwner:
                description: ConfigurationOwner says who edits this entry.
                enum:
                - Console
                - GitOps
                type: string
              connectionUID:
                description: |-
                  ConnectionUID is the connection's identity. Every route, cached view,
                  confirmation and request names it, so two clusters with the same name
                  cannot be confused, and a new connection to the same cluster is told
                  apart from the one it replaces.
                pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                type: string
              installationID:
                description: |-
                  InstallationID is the installation whose accounts act through this
                  connection, as ptah-console:<installationID>:<account id>. For the
                  cluster the console runs in it is the console's own installation ID, so
                  no account loses a grant when the registry is installed.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              namespaces:
                description: |-
                  Namespaces is the ceiling: the namespaces the console reads and acts in
                  through this connection. An account's own RBAC may narrow it further,
                  never widen it.
                items:
                  maxLength: 63
                  minLength: 1
                  pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                  type: string
                maxItems: 64
                minItems: 1
                type: array
                x-kubernetes-list-type: set
              profile:
                description: Profile is how the console reaches the cluster.
                enum:
                - CoLocated
                - Agent
                type: string
            required:
            - configurationOwner
            - connectionUID
            - installationID
            - namespaces
            - profile
            type: object
            x-kubernetes-validations:
            - message: a connection's trust and reach are immutable; enroll a new
                connection instead
              rule: self == oldSelf
            - message: an Agent connection names its agent trust, and a CoLocated
                one names none
              rule: (self.profile == 'Agent') == has(self.agent)
          status:
            description: |-
              Status is what the console's own identity last observed about the
              connection. Nothing else writes it.
            properties:
              conditions:
                description: Conditions are the connection's verdicts, Connected among
                  them.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastObservedAt:
                description: |-
                  LastObservedAt is when the console last heard from the cluster through
                  this connection.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the spec generation this status
                  describes.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
