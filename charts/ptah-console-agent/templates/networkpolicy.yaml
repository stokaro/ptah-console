{{- if .Values.networkPolicy.enabled -}}
# Nothing reaches the agent. It reaches the API server, cluster DNS to find
# the console, and the console's listener, and nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ptah-console-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ptah-console-agent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ptah-console-agent.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        {{- range .Values.networkPolicy.apiServer.cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        {{- range .Values.networkPolicy.apiServer.ports }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        {{- range .Values.networkPolicy.console.cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        {{- range .Values.networkPolicy.console.ports }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
{{- end }}
