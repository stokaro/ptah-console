---
# Source: ptah-console-agent/templates/impersonation.yaml
# The agent's one grant: impersonate exactly the allowlisted accounts'
# usernames. No groups, UIDs, extras or ServiceAccounts, and nothing else of
# its own: no Secret, no RBAC object, no Ptah resource.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-ptah-console-agent-impersonate
  labels:
    app.kubernetes.io/name: ptah-console-agent
    app.kubernetes.io/instance: agent
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: ptah-console-agent-0.1.0
rules:
  - apiGroups: [""]
    resources: ["users"]
    verbs: ["impersonate"]
    resourceNames:
      - ptah-console:prod:alex
      - ptah-console:prod:sam

---
# Source: ptah-console-agent/templates/impersonation.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-ptah-console-agent-impersonate
  labels:
    app.kubernetes.io/name: ptah-console-agent
    app.kubernetes.io/instance: agent
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: ptah-console-agent-0.1.0
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-ptah-console-agent-impersonate
subjects:
  - kind: ServiceAccount
    name: agent-ptah-console-agent
    namespace: ptah-console-agent

---
# Source: ptah-console-agent/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-ptah-console-agent
  namespace: ptah-console-agent
  labels:
    app.kubernetes.io/name: ptah-console-agent
    app.kubernetes.io/instance: agent
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: ptah-console-agent-0.1.0
spec:
  # One channel per connection: a rollout replaces the agent whole.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ptah-console-agent
      app.kubernetes.io/instance: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ptah-console-agent
        app.kubernetes.io/instance: agent
      annotations:
        checksum/configuration: 592b2471e8be394a8ee847a70750eae2aece13242643e745de257f3b17ce5769
    spec:
      serviceAccountName: agent-ptah-console-agent
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: ghcr.io/stokaro/ptah-console-agent:0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/ptah-console-agent/configuration/agent.yaml
            - --console-ca=/etc/ptah-console-agent/configuration/console-ca.pem
            - --accounts=/etc/ptah-console-agent/accounts/accounts.yaml
            - --credential=/etc/ptah-console-agent/credential/credential
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - name: configuration
              mountPath: /etc/ptah-console-agent/configuration
              readOnly: true
            # Mounted whole, not by subPath, so a changed allowlist and a
            # rotated credential reach the running agent.
            - name: accounts
              mountPath: /etc/ptah-console-agent/accounts
              readOnly: true
            - name: credential
              mountPath: /etc/ptah-console-agent/credential
              readOnly: true
      volumes:
        - name: configuration
          configMap:
            name: agent-ptah-console-agent
        - name: accounts
          configMap:
            name: agent-ptah-console-agent-accounts
        - name: credential
          secret:
            secretName: ptah-console-agent-credential
            items:
              - key: credential
                path: credential
