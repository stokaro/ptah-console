---
# Source: ptah-console-agent/templates/accounts.yaml
# The allowlist. The agent reads it again when it changes, without a
# restart, so the Deployment does not carry its checksum.
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-ptah-console-agent-accounts
  namespace: ptah-console-agent
  labels:
    app.kubernetes.io/name: ptah-console-agent
    app.kubernetes.io/instance: agent
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: ptah-console-agent-0.1.0
data:
  accounts.yaml: |
    apiVersion: console.ptah.run/v1alpha1
    kind: AgentAccounts
    accounts:
      - alex
      - sam

