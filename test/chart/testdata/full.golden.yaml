      protocol: TCP

---
# Source: ptah-console/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console-ptah-console
  namespace: ptah-console
  labels:
    app.kubernetes.io/name: ptah-console
    app.kubernetes.io/instance: console
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: ptah-console-0.1.0
spec:
  # Sessions live in the one replica's memory; a rollout replaces it whole.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ptah-console
      app.kubernetes.io/instance: console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ptah-console
        app.kubernetes.io/instance: console
      annotations:
        checksum/configuration: 0cbbc13a6b012789d7d99c8d355b238e93affe59061c35a7b3c7f41ac1408194
        example.com/team: data
    spec:
      serviceAccountName: console-ptah-console
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console
          image: ghcr.io/stokaro/ptah-console:0.1.0@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - --config=/etc/ptah-console/configuration/configuration.yaml
            - --passwords=/etc/ptah-console/passwords/htpasswd
            - --listen=:8443
            - --tls-terminated-upstream
            - --read-only
          ports:
            - name: http
              containerPort: 8443
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: HTTP
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: HTTP
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: configuration
              mountPath: /etc/ptah-console/configuration
              readOnly: true
            - name: passwords
              mountPath: /etc/ptah-console/passwords
              readOnly: true
      volumes:
        - name: configuration
          configMap:
            name: console-ptah-console
        - name: passwords
          secret:
            secretName: ptah-console-passwords
            items:
              - key: htpasswd
                path: htpasswd

---
# Source: ptah-console/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: console-ptah-console
  namespace: ptah-console
  labels:
    app.kubernetes.io/name: ptah-console
    app.kubernetes.io/instance: console
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: ptah-console-0.1.0
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["console.example.com"]
      secretName: console-example-com
  rules:
    - host: "console.example.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: console-ptah-console
                port:
                  number: 80

---
# Source: ptah-console/templates/httproute.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: console-ptah-console
  namespace: ptah-console
  labels:
    app.kubernetes.io/name: ptah-console
