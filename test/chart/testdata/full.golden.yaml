---
# Source: ptah-console/templates/networkpolicy.yaml
# The console takes requests from the peers given, and opens connections to
# the API server and nowhere else: it reads no database, no registry and no
# Secret of the operator's.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: console-ptah-console
  namespace: ptah-console
  labels:
    app.kubernetes.io/name: ptah-console
    app.kubernetes.io/instance: console
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: ptah-console-0.1.0
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ptah-console
      app.kubernetes.io/instance: console
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: 8443
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
  egress:
    - to:
        - ipBlock:
            cidr: 10.96.0.1/32
        - ipBlock:
            cidr: 172.18.0.0/16
      ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP

