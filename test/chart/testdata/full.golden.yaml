apiVersion: v1
kind: Service
metadata:
  name: console-ptah-console
  namespace: ptah-console
  labels:
    app.kubernetes.io/name: ptah-console
    app.kubernetes.io/instance: console
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: ptah-console-0.1.0
spec:
  type: ClusterIP
