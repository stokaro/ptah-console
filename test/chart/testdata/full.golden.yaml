---
# Source: ptah-console/templates/impersonation.yaml
# The console's one grant: impersonate exactly the accounts' usernames. No
# groups, UIDs, extras or ServiceAccounts, so each account may do what RBAC
# grants its username and nothing the console's ServiceAccount may.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: console-ptah-console-impersonate
  labels:
    app.kubernetes.io/name: ptah-console
    app.kubernetes.io/instance: console
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: ptah-console-0.1.0
rules:
  - apiGroups: [""]
    resources: ["users"]
    verbs: ["impersonate"]
    resourceNames:
      - ptah-console:prod-eu-1:alex
      - ptah-console:prod-eu-1:sam
      - ptah-console:prod-eu-1:kim

