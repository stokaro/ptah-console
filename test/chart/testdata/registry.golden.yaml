rules:
  - apiGroups: ["console.ptah.run"]
    resources: ["consoleclusters", "consoleclusterpreferences"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["console.ptah.run"]
    resources: ["consoleclusters/status"]
    verbs: ["update", "patch"]
  # Enrollments: their status, which records the bootstrap verifier and the
  # helper's report, and their removal once they expire.
  - apiGroups: ["console.ptah.run"]
    resources: ["consoleclusterenrollments"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: ["console.ptah.run"]
    resources: ["consoleclusterenrollments/status"]
    verbs: ["update", "patch"]

