---
# Source: ptah-console/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console-ptah-console
  namespace: ptah-console
  labels:
    app.kubernetes.io/name: ptah-console
    app.kubernetes.io/instance: console
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: ptah-console-0.1.0
spec:
  # Sessions live in the one replica's memory; a rollout replaces it whole.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ptah-console
      app.kubernetes.io/instance: console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ptah-console
        app.kubernetes.io/instance: console
      annotations:
        checksum/configuration: 6d7762a55acdec56bfd344544ce64388dd3950efd774a7ef7e2e5bce56b26f5e
    spec:
      serviceAccountName: console-ptah-console
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console
          image: ghcr.io/stokaro/ptah-console:0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - --config=/etc/ptah-console/configuration/configuration.yaml
            - --passwords=/etc/ptah-console/passwords/passwords
            - --listen=:8443
            - --tls-cert-file=/etc/ptah-console/tls/tls.crt
            - --tls-key-file=/etc/ptah-console/tls/tls.key
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: configuration
              mountPath: /etc/ptah-console/configuration
              readOnly: true
            - name: passwords
              mountPath: /etc/ptah-console/passwords
              readOnly: true
            - name: tls
              mountPath: /etc/ptah-console/tls
              readOnly: true
      volumes:
        - name: configuration
          configMap:
            name: console-ptah-console
        - name: passwords
          secret:
            secretName: ptah-console-passwords
            items:
              - key: passwords
                path: passwords
        - name: tls
          secret:
            secretName: console-tls
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key

