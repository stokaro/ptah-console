syntax = "proto3";

package ptah.console.v1;

import "google/protobuf/timestamp.proto";
import "ptah/console/v1/resources.proto";

option go_package = "github.com/stokaro/ptah-console/internal/gen/ptah/console/v1;consolev1";

// DecisionService records a person's decisions with their own identity and
// lists the decisions already made. The operator's admission decides whether
// a decision stands; the console reports what it said.
service DecisionService {
  rpc ListDecisions(ListDecisionsRequest) returns (ListDecisionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // GetDecision reads one decision back, which is how the outcome of a
  // submission whose response was lost is established.
  rpc GetDecision(GetDecisionRequest) returns (GetDecisionResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ApproveSchemaPlan approves exactly the plan the person reviewed, and only
  // a plan the console read and verified as that person.
  rpc ApproveSchemaPlan(ApproveSchemaPlanRequest) returns (ApproveSchemaPlanResponse) {}

  // ApproveMigrationPlan approves exactly the plan the person reviewed, and
  // only a plan the console read as that person.
  rpc ApproveMigrationPlan(ApproveMigrationPlanRequest) returns (ApproveMigrationPlanResponse) {}

  // AcknowledgeMigrationRun settles exactly one unresolved run. It does not
  // verify what the run did to the database.
  rpc AcknowledgeMigrationRun(AcknowledgeMigrationRunRequest) returns (AcknowledgeMigrationRunResponse) {}

  // SetSuspended suspends or resumes a schema or migration, changing nothing
  // else.
  rpc SetSuspended(SetSuspendedRequest) returns (SetSuspendedResponse) {}
  // RequestRead asks exactly the object the person saw to read its database
  // now, by setting its read-requested-at annotation to the current instant.
  // It changes nothing else: not the spec, not the generation, not the plan.
  rpc RequestRead(RequestReadRequest) returns (RequestReadResponse) {}
  // SetSource points exactly the object the person saw at another OCI
  // artifact, given as a reference pinned by digest, as kubectl ptah
  // set-source does. It sets spec.desired.ociRef of a schema or
  // spec.artifact.ociRef of a migration and changes nothing else: the
  // verification policy, the registry credential, the transport and the
  // apply policy stay as they are, and the new artifact is held to them. It
  // refuses a ConfigMap or Git source and a resource whose Apply may already
  // have its Job.
  rpc SetSource(SetSourceRequest) returns (SetSourceResponse) {}
}

enum DecisionKind {
  DECISION_KIND_UNSPECIFIED = 0;
  DECISION_KIND_SCHEMA_APPROVAL = 1;
  DECISION_KIND_MIGRATION_APPROVAL = 2;
  DECISION_KIND_RUN_ACKNOWLEDGMENT = 3;
}

// DecisionState is what the operator made of a decision.
enum DecisionState {
  DECISION_STATE_UNSPECIFIED = 0;
  // Nothing has said yet.
  DECISION_STATE_PENDING = 1;
  DECISION_STATE_ACCEPTED = 2;
  // Committed to one Apply dispatch, or the run it named was settled.
  DECISION_STATE_CONSUMED = 3;
  // The plan or run it named is no longer current; it will not be used.
  DECISION_STATE_STALE = 4;
  DECISION_STATE_REFUSED = 5;
}

message Decision {
  DecisionKind kind = 1;
  ObjectRef ref = 2;
  string owner_name = 3;
  string owner_uid = 4;
  string plan_name = 5;
  string plan_uid = 6;
  string plan_fingerprint = 7;
  string operation_id = 8;
  // Who decided, as admission recorded it.
  string decided_by = 9;
  repeated string decided_by_groups = 10;
  google.protobuf.Timestamp decided_at = 11;
  DecisionState state = 12;
  string state_reason = 13;
  repeated Condition conditions = 14;
  // Whether the plan an approval names is still stored, under its UID.
  PlanRetention plan_retention = 15;
}

// PlanRetention is whether an approved plan can still be read.
enum PlanRetention {
  // Not an approval, or not checked.
  PLAN_RETENTION_UNSPECIFIED = 0;
  PLAN_RETENTION_RETAINED = 1;
  // The plan is gone, or another object holds its name.
  PLAN_RETENTION_NOT_RETAINED = 2;
  // The identity may not read the plan.
  PLAN_RETENTION_NOT_GRANTED = 3;
  // The API server did not say.
  PLAN_RETENTION_UNKNOWN = 4;
}

message ListDecisionsRequest {
  repeated string namespaces = 1;
}

message ListDecisionsResponse {
  repeated Decision decisions = 1;
  repeated NamespaceResult namespaces = 2;
}

message GetDecisionRequest {
  DecisionKind kind = 1;
  string namespace = 2;
  string name = 3;
}

message GetDecisionResponse {
  Decision decision = 1;
}

message ApproveSchemaPlanRequest {
  string namespace = 1;
  string schema_name = 2;
  string schema_uid = 3;
  string plan_name = 4;
  string plan_uid = 5;
  string plan_fingerprint = 6;
  int32 contract_version = 7;
}

message ApproveMigrationPlanRequest {
  string namespace = 1;
  string migration_name = 2;
  string migration_uid = 3;
  string plan_name = 4;
  string plan_uid = 5;
  string plan_fingerprint = 6;
}

message AcknowledgeMigrationRunRequest {
  string namespace = 1;
  string migration_name = 2;
  string migration_uid = 3;
  string operation_id = 4;
}

// DecisionOutcome is how a submission ended.
enum DecisionOutcome {
  DECISION_OUTCOME_UNSPECIFIED = 0;
  // The API server stored the decision; admission recorded who made it.
  DECISION_OUTCOME_ADMITTED = 1;
  // What the person reviewed is no longer current. Nothing was sent.
  DECISION_OUTCOME_CHANGED = 2;
  // RBAC refused the identity.
  DECISION_OUTCOME_FORBIDDEN = 3;
  // The operator's admission or the API server refused the decision, or the
  // console did because it could not read and verify the plan. Nothing was
  // stored.
  DECISION_OUTCOME_REFUSED = 4;
  // The submission was sent and no answer came back. It may have been
  // stored; read it back by name before doing anything else.
  DECISION_OUTCOME_UNKNOWN = 5;
}

message DecisionResult {
  DecisionOutcome outcome = 1;
  // The API server's or admission's own words, or the console's when it sent
  // nothing.
  string message = 2;
  // The object's name, whatever the outcome, so it can be read back.
  string name = 3;
  string request_id = 4;
  Decision decision = 5;
}

message ApproveSchemaPlanResponse {
  DecisionResult result = 1;
}

message ApproveMigrationPlanResponse {
  DecisionResult result = 1;
}

message AcknowledgeMigrationRunResponse {
  DecisionResult result = 1;
}

enum ResourceKind {
  RESOURCE_KIND_UNSPECIFIED = 0;
  RESOURCE_KIND_SCHEMA = 1;
  RESOURCE_KIND_MIGRATION = 2;
}

message SetSuspendedRequest {
  ResourceKind kind = 1;
  string namespace = 2;
  string name = 3;
  // The object as the person saw it: the change applies only to that object
  // at that version.
  string uid = 4;
  string resource_version = 5;
  bool suspended = 6;
}

message SetSuspendedResponse {
  DecisionOutcome outcome = 1;
  string message = 2;
  string resource_version = 3;
}

message RequestReadRequest {
  ResourceKind kind = 1;
  string namespace = 2;
  string name = 3;
  // The object as the person saw it; another object under the name is not
  // asked.
  string uid = 4;
}

message RequestReadResponse {
  DecisionOutcome outcome = 1;
  string message = 2;
  // The value the annotation was set to.
  string requested = 3;
}

message SetSourceRequest {
  ResourceKind kind = 1;
  string namespace = 2;
  string name = 3;
  // The object the person saw, and the reference its spec named then. The
  // change applies only to that object, and only while its spec still names
  // that reference: another writer's reference is reported, never replaced.
  // No resource version comes from the page, because the operator writes
  // status between any two looks; the patch holds the resource version of
  // the console's own read, made just before it is sent.
  string uid = 4;
  string from_reference = 5;
  // The reference to set, pinned by a SHA-256 digest, as
  // oci://HOST/REPOSITORY@sha256:<64 hex>. The console refuses anything
  // looser before it reads the cluster.
  string reference = 6;
  // Ask the API server to judge the change and store nothing.
  bool dry_run = 7;
}

message SetSourceResponse {
  // ADMITTED for a dry run means accepted and not stored.
  DecisionOutcome outcome = 1;
  // The API server's or admission's own words, or the console's for CHANGED
  // and for a change that was not needed.
  string message = 2;
  bool dry_run = 3;
  // The spec names the reference because of this request. False with
  // ADMITTED when it named it already, and nothing was sent.
  bool changed = 4;
  // The field set: spec.desired.ociRef or spec.artifact.ociRef.
  string field = 5;
  // The reference the change replaced; empty when nothing was sent.
  string previous = 6;
  // The generation the change made, which the operator has to observe, and
  // the one it had observed when the answer was written.
  int64 generation = 7;
  int64 observed_generation = 8;
  string resource_version = 9;
  // spec.suspend: a suspended resource starts no Job, so nothing resolves
  // the new reference until it is resumed.
  bool suspended = 10;
  // The source as the API server stored it, or would store it for a dry
  // run, as YAML: the reference and the settings kept beside it.
  string source_yaml = 11;
}
