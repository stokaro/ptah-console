syntax = "proto3";

package ptah.console.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/stokaro/ptah-console/internal/gen/ptah/console/v1;consolev1";

// ConnectionService changes the registry of the clusters the console
// reaches. The API server decides who may: a request runs as the person, and
// only installation administrators are granted the registry's kinds.
service ConnectionService {
  // CreateEnrollment starts enrolling an external cluster. The answer holds
  // the enrollment file, with its single-use bootstrap secret, this once.
  rpc CreateEnrollment(CreateEnrollmentRequest) returns (CreateEnrollmentResponse) {}
  // ListEnrollments lists the enrollments the person may read.
  rpc ListEnrollments(ListEnrollmentsRequest) returns (ListEnrollmentsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // ActivateEnrollment makes a completed enrollment whose agent has
  // connected a connection.
  rpc ActivateEnrollment(ActivateEnrollmentRequest) returns (ActivateEnrollmentResponse) {}
}

message CreateEnrollmentRequest {
  // ClusterName is the name the connection will have.
  string cluster_name = 1;
  // Namespaces is the ceiling on the target.
  repeated string namespaces = 2;
  repeated EnrollmentAccount accounts = 3;
  // ApproverClusterRole is the operator chart's approver ClusterRole on the
  // target.
  string approver_cluster_role = 4;
}

// EnrollmentAccount is an account the agent will act for, with the roles it
// gets in every namespace of the ceiling.
message EnrollmentAccount {
  string id = 1;
  repeated string roles = 2;
}

message CreateEnrollmentResponse {
  // EnrollmentFile is the file the target administrator's helper reads. It
  // holds the bootstrap secret; the console keeps only its verifier.
  bytes enrollment_file = 1;
  // Fingerprint is what the helper shows too.
  string fingerprint = 2;
  google.protobuf.Timestamp expires_at = 3;
  string connection_uid = 4;
}

message ListEnrollmentsRequest {}

message ListEnrollmentsResponse {
  repeated Enrollment enrollments = 1;
}

// Enrollment is a connection being enrolled, as the console recorded it.
message Enrollment {
  string cluster_name = 1;
  string connection_uid = 2;
  repeated string namespaces = 3;
  repeated EnrollmentAccount accounts = 4;
  string approver_cluster_role = 5;
  string fingerprint = 6;
  // ExpiresAt is when the bootstrap stops being accepted.
  google.protobuf.Timestamp expires_at = 7;
  // Completion is what the target's helper reported, once it has.
  EnrollmentCompletion completion = 8;
  // AgentConnected is whether the agent has its channel open.
  bool agent_connected = 9;
}

// EnrollmentCompletion is what the target's helper reported.
message EnrollmentCompletion {
  string target_server = 1;
  string target_ca_sha256 = 2;
  google.protobuf.Timestamp completed_at = 3;
}

message ActivateEnrollmentRequest {
  string cluster_name = 1;
}

message ActivateEnrollmentResponse {
  string connection_uid = 1;
}
