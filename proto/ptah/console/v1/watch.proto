syntax = "proto3";

package ptah.console.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/stokaro/ptah-console/internal/gen/ptah/console/v1;consolev1";

// WatchService tells the page when what it shows has changed. It carries no
// objects: the page reads them again through the other services.
service WatchService {
  // Subscribe watches the namespaces as the session's identity, in windows
  // of at most thirty seconds, each of which the API server authorizes
  // again. The stream ends when the session does, or when the identity may
  // no longer watch.
  rpc Subscribe(SubscribeRequest) returns (stream SubscribeResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message SubscribeRequest {
  repeated string namespaces = 1;
}

message SubscribeResponse {
  oneof event {
    Invalidate invalidate = 1;
    Heartbeat heartbeat = 2;
    Lost lost = 3;
  }
}

// WatchedKind is a kind the stream reports changes to.
enum WatchedKind {
  WATCHED_KIND_UNSPECIFIED = 0;
  WATCHED_KIND_SCHEMA = 1;
  WATCHED_KIND_MIGRATION = 2;
  WATCHED_KIND_SCHEMA_APPROVAL = 3;
  WATCHED_KIND_MIGRATION_APPROVAL = 4;
  WATCHED_KIND_RUN_ACKNOWLEDGMENT = 5;
}

// Invalidate says an object changed. An empty name means anything of that
// kind in the namespace may have changed, as after the watch had to start
// over.
message Invalidate {
  WatchedKind kind = 1;
  string namespace = 2;
  string name = 3;
  string resource_version = 4;
}

// Heartbeat says the stream is alive and every watch was current at
// observed_at.
message Heartbeat {
  google.protobuf.Timestamp observed_at = 1;
}

// Lost says a watch stopped. What the page shows for that namespace and kind
// may be stale from here on.
message Lost {
  WatchedKind kind = 1;
  string namespace = 2;
  string reason = 3;
}
