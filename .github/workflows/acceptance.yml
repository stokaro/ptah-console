name: Acceptance

# The rows of stokaro/ptah-operator#587 against a real operator: the
# operator's own demonstration lab, from the operator commit this module
# requires, with the personas and fixtures hack/e2e adds. Each person signs in
# to a `ptah-console local` of their own, with a client certificate the
# cluster issued, and every row is recorded. web/e2e/console.spec.ts carries
# on from the state those rows leave, through the full console's later pages
# and actions. The hosted rows follow: this repository's chart, installed in
# the lab with the image built from this commit, signed in to with Console
# accounts. hack/e2e/verify.sh then checks the cluster's own account of what
# the rows decided, and the recordings are joined into the demo film.
#
# The two-cluster rows (web/e2e/two-clusters.spec.ts) then add a second kind
# cluster beside the lab, with the operator and no setup for the console, and
# enroll it through the agent.
#
# It runs on request, and on a pull request that changes the environment, the
# rows, the charts, the images, the agent or the registry: a run takes two
# clusters and over an hour. A request may name some of the row files, to
# rerun those alone; the cluster's own account is then not checked, since the
# rows it reads did not run.

on:
  workflow_dispatch:
    inputs:
      rows:
        description: Row files to run, such as two-clusters.spec.ts; empty runs them all
        required: false
        type: string
        default: ""
  pull_request:
    paths:
      - .github/workflows/acceptance.yml
      - hack/e2e/**
      - web/e2e/**
      - charts/**
      - Dockerfile
      - Dockerfile.agent
      - api/**
      - cmd/ptah-console-agent/**
      - internal/agent/**
      - internal/agentlink/**
      - internal/enrollment/**
      - internal/registry/**
      - internal/route/**
      - internal/wire/**
      - proto/ptah/console/agent/**

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rows:
    name: Run and record the rows
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check out the console
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/package.json
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The operator commit is the one go.mod requires: the console is shown
      # against the operator it is built against, not whatever master holds.
      - name: Check out the operator this module requires
        id: operator
        shell: bash
        run: |
          set -euo pipefail
          commit="$(./hack/e2e/operator.sh "$RUNNER_TEMP/operator")"
          printf 'dir=%s\n' "$RUNNER_TEMP/operator" >> "$GITHUB_OUTPUT"
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
      # Read from the operator checkout, as its own demo workflow does.
      - name: Read the operator's support window and Ptah commit
        id: support
        working-directory: ${{ steps.operator.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          newest="$(go run ./hack/verify-kubernetes-support.go -output=matrix | jq -c '[.[]] | last')"
          for field in minor_slug kind_version kubernetes_version; do
            printf '%s=%s\n' "$field" "$(printf '%s' "$newest" | jq -er --arg field "$field" '.[$field]')" >> "$GITHUB_OUTPUT"
          done
          printf 'ptah_commit=%s\n' "$(go run ./hack/verifyptahsupport -output=commit)" >> "$GITHUB_OUTPUT"
      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with:
          version: v4.3.0
      - name: Install kind and kubectl
        shell: bash
        run: |
          set -euo pipefail
          go install "sigs.k8s.io/kind@${{ steps.support.outputs.kind_version }}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          install_dir="$RUNNER_TEMP/bin"
          mkdir -p "$install_dir"
          base_url="https://dl.k8s.io/release/v${{ steps.support.outputs.kubernetes_version }}/bin/linux/amd64"
          curl --fail --location --silent --show-error --output "$install_dir/kubectl" "$base_url/kubectl"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/kubectl.sha256" "$base_url/kubectl.sha256"
          echo "$(<"$RUNNER_TEMP/kubectl.sha256")  $install_dir/kubectl" | sha256sum --check
          chmod 0755 "$install_dir/kubectl"
          echo "$install_dir" >> "$GITHUB_PATH"
      # The operator's harness refuses an implicit Docker daemon; it is given
      # an explicit context over SSH to this runner, as in its own workflow.
      - name: Configure an explicit Docker context
        id: docker-context
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes apache2-utils openssh-server ffmpeg
          ssh_key="$RUNNER_TEMP/ptah-e2e-ssh"
          known_hosts="$RUNNER_TEMP/ptah-e2e-known-hosts"
          install -d -m 0700 "$HOME/.ssh"
          ssh-keygen -q -t ed25519 -N '' -f "$ssh_key"
          install -m 0600 "$ssh_key.pub" "$HOME/.ssh/authorized_keys"
          sudo systemctl restart ssh
          ssh-keyscan -H 127.0.0.1 > "$known_hosts"
          {
            printf '%s\n' 'Host ptah-e2e-docker'
            printf '%s\n' '  HostName 127.0.0.1'
            printf '  User %s\n' "$USER"
            printf '  IdentityFile %s\n' "$ssh_key"
            printf '%s\n' '  IdentitiesOnly yes'
            printf '%s\n' '  StrictHostKeyChecking yes'
            printf '  UserKnownHostsFile %s\n' "$known_hosts"
          } > "$HOME/.ssh/config"
          chmod 0600 "$HOME/.ssh/config"
          context_name="ptah-console-e2e-${{ steps.support.outputs.minor_slug }}"
          docker context create "$context_name" --docker host=ssh://ptah-e2e-docker
          docker --context "$context_name" info >/dev/null
          printf 'name=%s\n' "$context_name" >> "$GITHUB_OUTPUT"
      - name: Install the web app and the browser
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Bring the acceptance environment up
        env:
          OPERATOR_DIR: ${{ steps.operator.outputs.dir }}
          OUT_DIR: ${{ runner.temp }}/e2e
          DOCKER_CONTEXT: ${{ steps.docker-context.outputs.name }}
          E2E_DIRECT_HOST_ACCESS: "1"
          E2E_PTAH_REVISION: ${{ steps.support.outputs.ptah_commit }}
          DEMO_KUBERNETES_VERSION: ${{ steps.support.outputs.kubernetes_version }}
          DEMO_RUN_ID: console-e2e-${{ github.run_id }}-${{ github.run_attempt }}
        run: make e2e-up
      - name: Run the rows
        env:
          OPERATOR_DIR: ${{ steps.operator.outputs.dir }}
          OUT_DIR: ${{ runner.temp }}/e2e
          E2E_ROWS: ${{ inputs.rows }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${E2E_ROWS:-}" =~ ^[a-z0-9.\ -]*$ ]] || { echo "rows names files, such as two-clusters.spec.ts"; exit 1; }
          make e2e-rows
      # Checks what the rows that ran did, all of them or the ones named.
      - name: Check the outcome against the cluster
        if: always() && steps.operator.outputs.dir != ''
        env:
          OPERATOR_DIR: ${{ steps.operator.outputs.dir }}
          OUT_DIR: ${{ runner.temp }}/e2e
          E2E_ROWS: ${{ inputs.rows }}
        run: make e2e-verify
      # The demo is the local phase: the rows each person runs against a
      # ptah-console local of their own. The full film adds the hosted and
      # two-cluster rows.
      - name: Join the recordings into films
        if: always()
        shell: bash
        env:
          ROWS_REQUESTED: ${{ inputs.rows }}
        run: |
          set -euo pipefail
          [ -d web/test-results ] || exit 0
          FILM="$GITHUB_WORKSPACE/film/ptah-console-full.mp4" make e2e-film
          # A run of some row files may hold no local row to make the demo of.
          if [ -z "$ROWS_REQUESTED" ]; then
            FILM="$GITHUB_WORKSPACE/film/ptah-console-demo.mp4" ROWS="acceptance.spec.ts console.spec.ts" make e2e-film
          fi
          for who in outsider viewer reviewer author lead approver diag; do
            cp "${{ runner.temp }}/e2e/$who-audit.log" "film/$who-audit.log" 2>/dev/null || true
          done
          printf 'operator %s\n' "${{ steps.operator.outputs.commit }}" > film/versions.txt
      - name: Keep the recordings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ptah-console-acceptance
          path: |
            film/
            web/test-results/
            web/playwright-report/
          if-no-files-found: warn
          retention-days: 30
      - name: Remove the environment
        if: always() && steps.operator.outputs.dir != ''
        env:
          OPERATOR_DIR: ${{ steps.operator.outputs.dir }}
          OUT_DIR: ${{ runner.temp }}/e2e
        run: make e2e-down
      - name: Remove the Docker context
        if: always() && steps.docker-context.outputs.name != ''
        run: docker context rm --force "${{ steps.docker-context.outputs.name }}"
