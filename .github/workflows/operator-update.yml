name: Operator update

# Keeps one pull request that moves the console to the newest released
# stokaro/ptah-operator. hack/operator-update.sh says when it rebuilds that
# pull request and when it leaves it to a person.
#
# The ptah-automation App pushes the branch and opens the pull request, as it
# does for stokaro/ptah's own automation, so the pull request runs its checks.
# Its token can write contents and pull requests in this repository only, and
# nothing here approves or merges a pull request.

on:
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operator-update
  cancel-in-progress: false

jobs:
  update:
    name: Move to the newest operator release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Mint a ptah-automation token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CAPABILITY_MATRIX_APP_ID }}
          private-key: ${{ secrets.CAPABILITY_MATRIX_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The tags say whether the record's first row is released.
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/buf/go.sum
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/package.json
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Move to the newest operator release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASES_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          hack/operator-update.sh
