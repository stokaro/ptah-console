name: Release

# A release of the console: the binary for every supported client platform,
# the multi-architecture image the chart runs, the agent's image and chart,
# both charts as release assets and as OCI artifacts, checksums and SBOMs, and
# a build provenance attestation for each of them, every one verified before
# the release is published.
#
# A tag v* releases. Run on request, or by a pull request that changes how a
# release is made, it is a dry run: the same build, attestations and checks,
# with the image and the chart pushed to a registry inside the job and no
# GitHub release. A dry run's version is the chart's.
#
# Each image goes to GHCR and to its mirror on Docker Hub, which anyone can
# pull without signing in. Both carry the same digest.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .goreleaser.yaml
      - Dockerfile
      - Dockerfile.agent
      - charts/ptah-console/Chart.yaml
      - charts/ptah-console-agent/Chart.yaml
      - hack/releasecheck/**
      - internal/release/**
      - support/compatibility.json

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, attest, verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      DRY_RUN: ${{ github.event_name == 'push' && '0' || '1' }}
      REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    services:
      # Where a dry run pushes the image and the chart. A release never
      # reaches it.
      registry:
        image: registry@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373 # 2.8.3
        ports:
          - 5000:5000
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/package.json
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the web app's dependencies
        working-directory: web
        run: npm ci
      - name: Name the version and where it goes
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" == 1 ]]; then
            version="$(sed -n 's/^version: //p' charts/ptah-console/Chart.yaml)"
            registry=localhost:5000
            mirrors=localhost:5000/mirror
            go run ./hack/releasecheck -version "$version"
          else
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "a release tag is vMAJOR.MINOR.PATCH, not $GITHUB_REF_NAME" >&2
              exit 1
            }
            version="${GITHUB_REF_NAME#v}"
            registry=ghcr.io/stokaro
            mirrors=docker.io/stokaro
            go run ./hack/releasecheck -version "$version" -release
          fi
          {
            printf 'version=%s\n' "$version"
            printf 'image=%s/ptah-console\n' "$registry"
            printf 'mirror=%s/ptah-console\n' "$mirrors"
            printf 'agent-image=%s/ptah-console-agent\n' "$registry"
            printf 'agent-mirror=%s/ptah-console-agent\n' "$mirrors"
            printf 'charts=%s/charts\n' "$registry"
          } >> "$GITHUB_OUTPUT"
      - name: Set up QEMU for the arm64 image
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
        with:
          # The builder reaches the job's registry on the runner's network.
          driver-opts: network=host
      - name: Sign in to GHCR
        if: env.DRY_RUN == '0'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Before anything is pushed, so a bad Docker Hub credential stops the
      # release before GHCR has the image. stokaro on Docker Hub is an
      # organization, and the token belongs to a member, as in stokaro/ptah.
      - name: Sign in to Docker Hub
        if: env.DRY_RUN == '0'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Install Syft for the SBOMs
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Build the binaries, archives and image
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          # A dry run builds as the chart's version without a tag of it.
          args: release --clean ${{ env.DRY_RUN == '1' && '--skip=validate' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.version.outputs.image }}
          MIRROR_IMAGE: ${{ steps.version.outputs.mirror }}
          AGENT_IMAGE: ${{ steps.version.outputs.agent-image }}
          AGENT_MIRROR_IMAGE: ${{ steps.version.outputs.agent-mirror }}
          GORELEASER_CURRENT_TAG: v${{ steps.version.outputs.version }}
      - name: Read the image digests
        id: image
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          AGENT_IMAGE: ${{ steps.version.outputs.agent-image }}
        shell: bash
        run: |
          set -euo pipefail
          # The one digest every artifact goreleaser pushed under an image's
          # name or its mirror's carries.
          digest_of() {
            jq -er --arg image "$1" '[.[] | select(.extra.Digest != null and (.type | test("Docker"))
                and ((.name // "") | startswith($image + ":"))) | .extra.Digest] | unique
              | if length == 1 then .[0] else error("expected one digest for \($image), found \(length)") end' dist/artifacts.json
          }
          digest="$(digest_of "$IMAGE")"
          agent="$(digest_of "$AGENT_IMAGE")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ && "$agent" =~ ^sha256:[0-9a-f]{64}$ && "$digest" != "$agent" ]]
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf 'agent=%s\n' "$agent" >> "$GITHUB_OUTPUT"
      # The mirror is for people who pull without signing in, so it is read
      # without signing in, and its tag has to name the digest GHCR got.
      - name: Check the mirrors serve the same images
        env:
          MIRROR: ${{ steps.version.outputs.mirror }}
          AGENT_MIRROR: ${{ steps.version.outputs.agent-mirror }}
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.image.outputs.digest }}
          AGENT_DIGEST: ${{ steps.image.outputs.agent }}
        shell: bash
        run: |
          set -euo pipefail
          accept='application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json'
          serves() {
            local mirror=$1 digest=$2 repository="${1#*/}" auth=() manifests served token
            if [[ "$DRY_RUN" == 1 ]]; then
              manifests="http://${mirror%%/*}/v2/$repository/manifests"
            else
              token="$(curl -fsS "https://auth.docker.io/token?service=registry.docker.io&scope=repository:$repository:pull" | jq -er .token)"
              auth=(-H "Authorization: Bearer $token")
              manifests="https://registry-1.docker.io/v2/$repository/manifests"
            fi
            served="$(curl -fsSI "${auth[@]}" -H "Accept: $accept" "$manifests/$VERSION" | tr -d '\r' | sed -n 's/^[Dd]ocker-[Cc]ontent-[Dd]igest: //p')"
            printf '%s:%s serves %s\n' "$mirror" "$VERSION" "${served:-nothing}"
            [[ "$served" == "$digest" ]] || { echo "the mirror does not serve $digest" >&2; exit 1; }
          }
          serves "$MIRROR" "$DIGEST"
          serves "$AGENT_MIRROR" "$AGENT_DIGEST"
      - name: Package and push the chart
        id: chart
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHARTS: ${{ steps.version.outputs.charts }}
          REGISTRY_USER: ${{ github.actor }}
        shell: bash
        run: |
          set -euo pipefail
          helm() { go tool -modfile=tools/chart/go.mod helm "$@"; }
          mkdir -p dist/chart
          if [[ "$DRY_RUN" == 0 ]]; then
            printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$REGISTRY_USER" --password-stdin
          fi
          # push packages one chart, pushes it, and records the file and the
          # digest its registry gave it under the output named.
          push() {
            local name=$1 output=$2 chart pushed digest
            helm package "charts/$name" --version "$VERSION" --app-version "$VERSION" --destination dist/chart
            chart="dist/chart/$name-$VERSION.tgz"
            [[ -s "$chart" ]]
            if [[ "$DRY_RUN" == 1 ]]; then
              pushed="$(helm push "$chart" "oci://$CHARTS" --plain-http 2>&1)"
            else
              pushed="$(helm push "$chart" "oci://$CHARTS" 2>&1)"
            fi
            printf '%s\n' "$pushed"
            digest="$(printf '%s\n' "$pushed" | sed -n 's/^Digest: //p')"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            {
              printf '%sfile=%s\n' "$output" "$chart"
              printf '%sdigest=%s\n' "$output" "$digest"
            } >> "$GITHUB_OUTPUT"
          }
          push ptah-console ""
          push ptah-console-agent agent-
      - name: Attest the files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sbom.json
            dist/SHA256SUMS
            dist/chart/*.tgz
      - name: Attest the image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ${{ steps.version.outputs.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: ${{ env.DRY_RUN == '0' }}
      - name: Attest the agent's image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ${{ steps.version.outputs.agent-image }}
          subject-digest: ${{ steps.image.outputs.agent }}
          push-to-registry: ${{ env.DRY_RUN == '0' }}
      - name: Attest the chart in its registry
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ${{ steps.version.outputs.charts }}/ptah-console
          subject-digest: ${{ steps.chart.outputs.digest }}
          push-to-registry: ${{ env.DRY_RUN == '0' }}
      - name: Attest the agent's chart in its registry
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ${{ steps.version.outputs.charts }}/ptah-console-agent
          subject-digest: ${{ steps.chart.outputs.agent-digest }}
          push-to-registry: ${{ env.DRY_RUN == '0' }}
      # Each artifact is checked the way a person installing it would: the
      # attestation names this repository and this workflow.
      - name: Verify every attestation
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          MIRROR: ${{ steps.version.outputs.mirror }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          AGENT_IMAGE: ${{ steps.version.outputs.agent-image }}
          AGENT_MIRROR: ${{ steps.version.outputs.agent-mirror }}
          AGENT_DIGEST: ${{ steps.image.outputs.agent }}
          CHARTS: ${{ steps.version.outputs.charts }}
          CHART_DIGEST: ${{ steps.chart.outputs.digest }}
          AGENT_CHART_DIGEST: ${{ steps.chart.outputs.agent-digest }}
        shell: bash
        run: |
          set -euo pipefail
          verify() {
            gh attestation verify "$1" --repo "$REPOSITORY" \
              --signer-workflow "$REPOSITORY/.github/workflows/release.yml" >/dev/null
            printf 'verified %s\n' "$1"
          }
          checked=0
          for file in dist/*.tar.gz dist/*.zip dist/*.sbom.json dist/SHA256SUMS dist/chart/*.tgz; do
            verify "$file"
            checked=$((checked + 1))
          done
          # Six archives, six SBOMs, the checksums and the two charts.
          [[ "$checked" == 15 ]] || { echo "verified $checked files, expected 15" >&2; exit 1; }
          verify "oci://$IMAGE@$IMAGE_DIGEST"
          verify "oci://$MIRROR@$IMAGE_DIGEST"
          verify "oci://$AGENT_IMAGE@$AGENT_DIGEST"
          verify "oci://$AGENT_MIRROR@$AGENT_DIGEST"
          verify "oci://$CHARTS/ptah-console@$CHART_DIGEST"
          verify "oci://$CHARTS/ptah-console-agent@$AGENT_CHART_DIGEST"
          (cd dist && sha256sum --check --strict SHA256SUMS)
      - name: Publish the release
        if: env.DRY_RUN == '0'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHART: ${{ steps.chart.outputs.file }}
          AGENT_CHART: ${{ steps.chart.outputs.agent-file }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "v$VERSION" "$CHART" "$AGENT_CHART" --repo "$REPOSITORY"
          gh release edit "v$VERSION" --draft=false --repo "$REPOSITORY"
      - name: Keep the dry run's artifacts
        if: env.DRY_RUN == '1'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ptah-console-release-dry-run
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sbom.json
            dist/SHA256SUMS
            dist/chart/*.tgz
            dist/artifacts.json
          retention-days: 14
