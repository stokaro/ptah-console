name: Bug report
description: The console shows, sends or allows something it should not.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Write a short title in plain English that names the problem or intended
        result. Avoid internal names and unexplained acronyms.

        **Redact credentials.** Kubeconfigs, tokens, passwords and database
        URLs never belong in an issue.
  - type: textarea
    id: what-happened
    attributes:
      label: Problem summary
      description: >-
        In a short paragraph, usually two to four sentences, explain what the
        console shows or does, what you expected, and why the difference is a
        problem. Use plain English. Put architecture and implementation details
        after this introduction.
    validations:
      required: true
  - type: input
    id: console-version
    attributes:
      label: Console version
      description: The output of `ptah-console version`, or the chart version.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: ["local", "hosted"]
    validations:
      required: true
  - type: input
    id: operator-version
    attributes:
      label: Operator version
    validations:
      required: true
  - type: input
    id: kubernetes
    attributes:
      label: Kubernetes version and distribution
    validations:
      required: true
