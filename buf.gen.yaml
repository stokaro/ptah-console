# Every plugin is pinned by a lockfile in this repository: the Go ones by
# go.mod (`go tool`), protoc-gen-es by web/package-lock.json.
version: v2
clean: true
plugins:
  - local: ["go", "tool", "protoc-gen-go"]
    out: internal/gen
    opt: paths=source_relative
  - local: ["go", "tool", "protoc-gen-connect-go"]
    out: internal/gen
    opt: paths=source_relative
  - local: web/node_modules/.bin/protoc-gen-es
    out: web/app/src/gen
    # Enums as `as const` objects: the strict tsconfig sets
    # erasableSyntaxOnly, and TypeScript enums are not erasable.
    opt:
      - target=ts
      - erasable_syntax=true
