# A schema whose source the author changes through the console: a new
# artifact revision that waits for an approval.
apiVersion: operator.ptah.run/v1alpha1
kind: PtahSchema
metadata:
  name: pricing
  namespace: ${NAMESPACE}
spec:
  target:
    engine: PostgreSQL
    coordinationKey: e2e/pricing
    urlFrom:
      name: e2e-database-pricing
      key: url
  desired:
    ociRef: oci://${REGISTRY}/schemas/pricing@${DIGEST}
    registryAuthFrom:
      name: demo-registry
      mode: Environment
      usernameKey: username
      passwordKey: password
    verificationPolicyFrom:
      name: demo-verification-policy
      key: policy.yaml
    transport:
      plainHTTP: true
  policy:
    apply: ${APPLY}
    allowDestructive: false
  interval: ${INTERVAL}
  execution:
    activeDeadlineSeconds: 300
    failureRetryInterval: 30m
    connectTimeout: 30s
