# A prepared sequence of migrations on a PostgreSQL database of its own.
apiVersion: operator.ptah.run/v1alpha1
kind: PtahMigration
metadata:
  name: billing
  namespace: ${NAMESPACE}
spec:
  target:
    engine: PostgreSQL
    coordinationKey: e2e/billing
    urlFrom:
      name: e2e-database-billing
      key: url
  artifact:
    ociRef: oci://${REGISTRY}/migrations/billing@${DIGEST}
    registryAuthFrom:
      name: demo-registry
      mode: Environment
      usernameKey: username
      passwordKey: password
    verificationPolicyFrom:
      name: demo-migration-verification-policy
      key: policy.yaml
    transport:
      plainHTTP: true
  policy:
    apply: ${APPLY}
    lockTimeout: 30s
  interval: ${INTERVAL}
  execution:
    activeDeadlineSeconds: 300
    # Long enough that a failed run stays the last one while it is read.
    failureRetryInterval: 30m
    connectTimeout: 30s
