# A prepared sequence of migrations on the lab's MySQL. MySQL commits each DDL
# statement on its own, so a migration that fails halfway has already changed
# the schema, and no transaction mode takes that back.
#
# The operator's lab rendered this resource for its own runs up to v0.2.8, from
# demo/manifests/deliveries.yaml; from v0.2.9 its runs write their own and the
# lab keeps templates only for storefront and shipments, so the rows keep this
# copy.
apiVersion: operator.ptah.run/v1alpha1
kind: PtahMigration
metadata:
  name: deliveries
  namespace: ${NAMESPACE}
spec:
  target:
    engine: MySQL
    # A database of its own, so this key is its own realm.
    coordinationKey: demo/deliveries/mysql
    urlFrom:
      name: demo-mysql-database
      key: url
  artifact:
    ociRef: oci://${REGISTRY}/migrations/deliveries@${DIGEST}
    registryAuthFrom:
      name: demo-registry
      mode: Environment
      usernameKey: username
      passwordKey: password
    verificationPolicyFrom:
      name: demo-migration-verification-policy
      key: policy.yaml
    transport:
      plainHTTP: true
  policy:
    apply: ${APPLY}
    lockTimeout: 30s
    # Each statement commits as it runs, which is what DDL does on MySQL
    # anyway; saying so makes the resource mean what the database does.
    transactionMode: none
  interval: ${INTERVAL}
  execution:
    activeDeadlineSeconds: 300
    failureRetryInterval: 10s
    connectTimeout: 30s
